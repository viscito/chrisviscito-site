openapi: 3.1.0
info:
  title: Crossfade API
  version: "0.1.0"
  description: >
    Phase-1 (Apple Music MVP) API for Crossfade — a multi-platform music app that
    links streaming services and builds cross-platform playlists. This is the full
    backend contract; the developer-token and connection endpoints are already
    implemented by `backend/token-service`, and playlist sync is driven by
    `backend/sync-worker`.


    Requirements traceability: R1 provider requirements (entitlement gating),
    R2 import-kept-in-sync, R3 cross-platform search, R4 provider on every track,
    R5 supported-services browser.
servers:
  - url: https://api.crossfade.app/v1
    description: Production (illustrative)
  - url: http://localhost:8787/v1
    description: Local token-service (subset)

security:
  - crossfadeSession: []

tags:
  - name: Auth
    description: Crossfade accounts & sessions. Every other endpoint requires a session.
  - name: Services
    description: Streaming-service support (R5) and per-user connections (R1).
  - name: Library
    description: The user's unified, cross-service library.
  - name: Search
    description: Cross-platform search (R3).
  - name: Playlists
    description: Crossfade playlists — may mix tracks from any linked service (R4).
  - name: Import
    description: Import existing playlists, kept in sync (R2).
  - name: Sync
    description: Trigger and inspect kept-in-sync reconciliation (R2).
  - name: Playback
    description: Resolve a playlist into a per-listener playable queue.

paths:
  # ------------------------------------------------------------------ Auth
  /auth/session:
    post:
      tags: [Auth]
      summary: Create a session
      operationId: createSession
      description: >
        Exchange a sign-in (e.g. Sign in with Apple identity token) for a Crossfade
        session. The returned session token authenticates every other endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCreate" }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/session/refresh:
    post:
      tags: [Auth]
      summary: Refresh a session
      operationId: refreshSession
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me:
    get:
      tags: [Auth]
      summary: Get the current account
      operationId: getMe
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [Auth]
      summary: Delete the account and all data
      operationId: deleteMe
      description: Deletes the account, all playlists, and every stored service token (privacy).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # -------------------------------------------------------------- Services
  /services:
    get:
      tags: [Services]
      summary: List services and their support + connection state (R5)
      operationId: listServices
      description: >
        The top-5 US services with Crossfade support status (R5) merged with this
        user's connection state (R1). Powers the supported-services browser and
        settings.
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceWithConnection" }
                required: [services]
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /apple-music/developer-token:
    get:
      tags: [Services]
      summary: Vend a short-lived Apple Music developer token (for MusicKit)
      operationId: vendAppleDeveloperToken
      description: Implemented by `token-service`. Rate-limited per user.
      responses:
        "200":
          description: A developer token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeveloperToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /apple-music/connections:
    post:
      tags: [Services]
      summary: Connect Apple Music
      operationId: connectAppleMusic
      description: >
        Store the device-obtained Music User Token (encrypted) and record the
        entitlement (R1). Implemented by `token-service`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleConnectRequest" }
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/InvalidUserToken" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [Services]
      summary: Disconnect Apple Music
      operationId: disconnectAppleMusic
      description: Real revoke — deletes the stored token and cached library.
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /apple-music/connections/refresh:
    post:
      tags: [Services]
      summary: Re-validate the Apple Music connection
      operationId: refreshAppleConnection
      responses:
        "200":
          description: Refreshed connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotConnected" }

  # --------------------------------------------------------------- Library
  /library/tracks:
    get:
      tags: [Library]
      summary: The user's unified library
      operationId: listLibraryTracks
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of unified tracks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UnifiedTrack" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /tracks/{trackId}:
    get:
      tags: [Library]
      summary: A unified track and its per-service mappings (R4)
      operationId: getTrack
      parameters:
        - $ref: "#/components/parameters/TrackId"
      responses:
        "200":
          description: The track
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnifiedTrackDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Search
  /search:
    get:
      tags: [Search]
      summary: Cross-platform search (R3)
      operationId: search
      description: >
        Fans out to the user's linked services, de-duplicates results by ISRC, and
        marks which services can play each result (R1/R4).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: services
          in: query
          description: "Restrict to these services (default: all linked)."
          schema:
            type: array
            items: { $ref: "#/components/schemas/ServiceId" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Deduped results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SearchResult" }
                required: [results]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ------------------------------------------------------------- Playlists
  /playlists:
    get:
      tags: [Playlists]
      summary: List the user's playlists
      operationId: listPlaylists
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of playlists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Playlist" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Playlists]
      summary: Create a playlist
      operationId: createPlaylist
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /playlists/{playlistId}:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      tags: [Playlists]
      summary: Get a playlist with expanded items (R4)
      operationId: getPlaylist
      responses:
        "200":
          description: The playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Playlists]
      summary: Update playlist metadata or item order
      operationId: updatePlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Playlists]
      summary: Delete a playlist
      operationId: deletePlaylist
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /playlists/{playlistId}/items:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    post:
      tags: [Playlists]
      summary: Add tracks to a playlist (mixed-service, R4)
      operationId: addPlaylistItems
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddItemsRequest" }
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /playlists/{playlistId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
      - $ref: "#/components/parameters/ItemId"
    patch:
      tags: [Playlists]
      summary: Move an item or pin its preferred service
      operationId: updatePlaylistItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemUpdate" }
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Playlists]
      summary: Remove an item from a playlist
      operationId: removePlaylistItem
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Import
  /import/{service}/playlists:
    parameters:
      - $ref: "#/components/parameters/Service"
    get:
      tags: [Import]
      summary: List a linked service's playlists (import candidates)
      operationId: listImportCandidates
      responses:
        "200":
          description: Source playlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderPlaylist" }
                required: [playlists]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/InsufficientPlan" }
        "404": { $ref: "#/components/responses/NotConnected" }
    post:
      tags: [Import]
      summary: Import playlists (creates kept-in-sync Crossfade playlists, R2)
      operationId: importPlaylists
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "201":
          description: Imported playlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/Playlist" }
                required: [playlists]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotConnected" }

  # ------------------------------------------------------------------ Sync
  /playlists/{playlistId}/sync:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      tags: [Sync]
      summary: Last sync status for an imported playlist (R2)
      operationId: getSyncStatus
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotSynced" }
    post:
      tags: [Sync]
      summary: Trigger a sync now (R2)
      operationId: triggerSync
      description: Runs the reconciliation immediately instead of waiting for the scheduled worker.
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotSynced" }

  # -------------------------------------------------------------- Playback
  /playlists/{playlistId}/queue:
    parameters:
      - $ref: "#/components/parameters/PlaylistId"
    get:
      tags: [Playback]
      summary: Resolve a playlist into a per-listener playable queue
      operationId: getPlaylistQueue
      description: >
        Resolves each item to the service the *listener* can play (R1), returning
        ordered TrackRefs the conductor consumes. Unplayable items are included with
        a reason so the client can badge or skip them.
      responses:
        "200":
          description: The resolved queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracks:
                    type: array
                    items: { $ref: "#/components/schemas/QueueTrack" }
                required: [tracks]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    crossfadeSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The Crossfade account session token from POST /auth/session.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous page's `nextCursor`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A client-generated key so retried POSTs create a resource at most once.
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Service:
      name: service
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ServiceId" }

  responses:
    BadRequest:
      description: Malformed request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Missing or invalid session
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InsufficientPlan:
      description: Action needs an active subscription (R1)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidUserToken:
      description: The provider rejected the supplied user token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotConnected:
      description: The service is not connected
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotSynced:
      description: The playlist is not an imported/synced playlist
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Version conflict (stale update)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Stable machine-readable code.
          examples: [unauthenticated, insufficient_plan, invalid_user_token, not_connected, rate_limited, not_found]
        message: { type: string }
      required: [error]
    Page:
      type: object
      properties:
        data: { type: array, items: {} }
        nextCursor:
          type: [string, "null"]
          description: Cursor for the next page, or null if this is the last page.
      required: [data, nextCursor]

    ServiceId:
      type: string
      enum: [appleMusic, spotify, amazonMusic, youTubeMusic, pandora]
    PlaybackMode:
      type: string
      enum: [inApp, backgroundBroker, deepLinkHandoff]
      description: A/B keep the user in-app; C (deep link) does not. See ARCHITECTURE §2.1.
    SupportStatus:
      type: string
      enum: [live, comingNext, investigating, notSupported]
    EntitlementState:
      type: string
      enum: [active, insufficientPlan, unknown]

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
      required: [id, createdAt]
    SessionCreate:
      type: object
      properties:
        provider:
          type: string
          enum: [apple, email]
        identityToken:
          type: string
          description: e.g. the Sign in with Apple identity token.
      required: [provider, identityToken]
    Session:
      type: object
      properties:
        token: { type: string, description: Crossfade session JWT. }
        expiresAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
      required: [token, expiresAt, account]

    ServiceDescriptor:
      type: object
      description: Static support info for a service (R5).
      properties:
        service: { $ref: "#/components/schemas/ServiceId" }
        displayName: { type: string }
        playbackMode: { $ref: "#/components/schemas/PlaybackMode" }
        status: { $ref: "#/components/schemas/SupportStatus" }
        requirement: { type: string, description: "Provider requirement to play (R1), e.g. 'Apple Music subscription'." }
        note: { type: string }
      required: [service, displayName, playbackMode, status, requirement]
    Connection:
      type: object
      description: A user's link to a service (R1).
      properties:
        service: { $ref: "#/components/schemas/ServiceId" }
        entitlement: { $ref: "#/components/schemas/EntitlementState" }
        storefront: { type: [string, "null"] }
        connectedAt: { type: string, format: date-time }
      required: [service, entitlement]
    ServiceWithConnection:
      allOf:
        - $ref: "#/components/schemas/ServiceDescriptor"
        - type: object
          properties:
            connection:
              oneOf:
                - $ref: "#/components/schemas/Connection"
                - type: "null"
            canPlay:
              type: boolean
              description: isLinked AND entitlement active (R1).
    DeveloperToken:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [token, expiresAt]
    AppleConnectRequest:
      type: object
      properties:
        musicUserToken: { type: string }
        canPlayCatalogContent: { type: boolean }
        storefront: { type: string }
      required: [musicUserToken]

    UnifiedTrack:
      type: object
      description: A canonical, service-agnostic recording (R4). Keyed cross-service by ISRC.
      properties:
        id: { type: string, format: uuid }
        isrc: { type: [string, "null"] }
        title: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: [string, "null"] }
        durationMillis: { type: integer }
        artworkUrl: { type: [string, "null"], format: uri }
        isExplicit: { type: boolean }
      required: [id, title, artists, durationMillis]
    TrackMapping:
      type: object
      properties:
        service: { $ref: "#/components/schemas/ServiceId" }
        providerTrackId: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, description: "1.0 = ISRC match." }
        verifiedByUser: { type: boolean }
      required: [service, providerTrackId, confidence]
    UnifiedTrackDetail:
      allOf:
        - $ref: "#/components/schemas/UnifiedTrack"
        - type: object
          properties:
            mappings:
              type: array
              items: { $ref: "#/components/schemas/TrackMapping" }
          required: [mappings]

    SearchResult:
      type: object
      properties:
        track: { $ref: "#/components/schemas/UnifiedTrack" }
        availableOn:
          type: array
          description: Services this recording exists on among the user's linked services.
          items: { $ref: "#/components/schemas/ServiceId" }
        playableOn:
          type: array
          description: Subset of availableOn the user can actually play right now (R1).
          items: { $ref: "#/components/schemas/ServiceId" }
      required: [track, availableOn, playableOn]

    PlaylistItemOrigin:
      type: string
      enum: [imported, local]
    Playlist:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        detail: { type: [string, "null"] }
        trackCount: { type: integer }
        importedFrom:
          oneOf:
            - $ref: "#/components/schemas/PlaylistSource"
            - type: "null"
        updatedAt: { type: string, format: date-time }
      required: [id, title, trackCount, updatedAt]
    PlaylistSource:
      type: object
      properties:
        service: { $ref: "#/components/schemas/ServiceId" }
        providerPlaylistId: { type: string }
        lastSyncedAt: { type: [string, "null"], format: date-time }
      required: [service, providerPlaylistId]
    PlaylistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        track: { $ref: "#/components/schemas/UnifiedTrack" }
        origin: { $ref: "#/components/schemas/PlaylistItemOrigin" }
        preferredService:
          oneOf:
            - $ref: "#/components/schemas/ServiceId"
            - type: "null"
      required: [id, track, origin]
    PlaylistDetail:
      allOf:
        - $ref: "#/components/schemas/Playlist"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/PlaylistItem" }
          required: [items]
    PlaylistCreate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        detail: { type: string }
      required: [title]
    PlaylistUpdate:
      type: object
      description: Partial update. `itemOrder` reorders by item id.
      properties:
        title: { type: string }
        detail: { type: string }
        itemOrder:
          type: array
          items: { type: string, format: uuid }
    AddItemsRequest:
      type: object
      properties:
        unifiedTrackIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        position:
          type: integer
          description: Insert index; appends if omitted.
      required: [unifiedTrackIds]
    ItemUpdate:
      type: object
      properties:
        position: { type: integer }
        preferredService: { $ref: "#/components/schemas/ServiceId" }

    ProviderPlaylist:
      type: object
      properties:
        id: { type: string }
        service: { $ref: "#/components/schemas/ServiceId" }
        title: { type: string }
        trackCount: { type: integer }
      required: [id, service, title, trackCount]
    ImportRequest:
      type: object
      properties:
        providerPlaylistIds:
          type: array
          items: { type: string }
          minItems: 1
        keepInSync:
          type: boolean
          default: true
          description: When true (default), the imported playlist stays linked to the source (R2).
      required: [providerPlaylistIds]

    SyncStatus:
      type: object
      properties:
        playlistId: { type: string, format: uuid }
        lastSyncedAt: { type: [string, "null"], format: date-time }
        lastDiff:
          oneOf:
            - $ref: "#/components/schemas/SyncDiff"
            - type: "null"
      required: [playlistId]
    SyncDiff:
      type: object
      properties:
        addedTrackIds: { type: array, items: { type: string, format: uuid } }
        removedItemIds: { type: array, items: { type: string, format: uuid } }
        reordered: { type: boolean }
      required: [addedTrackIds, removedItemIds, reordered]

    QueueTrack:
      type: object
      description: A resolved, ordered pointer the conductor plays (or skips).
      properties:
        unifiedTrackId: { type: string, format: uuid }
        title: { type: string }
        artist: { type: string }
        durationMillis: { type: integer }
        service: { $ref: "#/components/schemas/ServiceId" }
        providerTrackId: { type: string }
        playbackMode: { $ref: "#/components/schemas/PlaybackMode" }
        playable: { type: boolean }
        blockedReason:
          type: [string, "null"]
          enum: [notSubscribed, notAuthorized, unavailableInRegion, leavesApp, null]
          description: Why the track can't play (R1), or null when playable.
      required: [unifiedTrackId, title, artist, service, providerTrackId, playbackMode, playable]
